name: Сборка

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: swift --version
      - name: Сборка
        run: swift build -c release --product Zametki
      - name: Тесты
        run: swift test
        env:
          ZAMETKI_ARTIFACTS: ${{ github.workspace }}/artifacts
      - name: Скриншоты приложения
        continue-on-error: true
        run: |
          # Иконку (.icon) собирает только свежий Xcode - для скриншота хватит приложения без неё.
          bundle() {
            mkdir -p $2/Contents/MacOS $2/Contents/Resources
            cp "$1/Zametki" $2/Contents/MacOS/
            cp Resources/Info.plist $2/Contents/
            cp Resources/Caveat.ttf $2/Contents/Resources/
            codesign --force --sign - $2
          }
          shot() {
            python3 tools/ci-demo.py
            open "$1" --args -openNote demo-ci "${@:3}"
            sleep 10
            screencapture -x "artifacts/$2.png"
            pkill -x Zametki || true
            sleep 2
          }
          bundle "$(swift build -c release --show-bin-path)" build/Zametki.app
          # Та же сцена в версии из main - чтобы отличить свою поломку от особенностей CI.
          git fetch --depth=1 origin main
          git worktree add ../main FETCH_HEAD
          (cd ../main && swift build -c release --product Zametki)
          bundle "$(cd ../main && swift build -c release --show-bin-path)" build/Main.app
          mkdir -p artifacts
          shot build/Zametki.app app
          shot build/Zametki.app app-menu -uiLayout craft -inspectorShown YES -demoType /
          shot build/Main.app main-slash -uiLayout quiet -demoType /
          shot build/Zametki.app app-slash -uiLayout quiet -demoType /
          shot build/Zametki.app app-focus -uiLayout notebook -focusMode YES -demoSelect 40,10
      - name: Картинки экспорта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/
          if-no-files-found: ignore
