name: Сборка

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: swift --version
      - name: Сборка
        run: swift build -c release --product Zametki
      - name: Тесты
        run: swift test
        env:
          ZAMETKI_ARTIFACTS: ${{ github.workspace }}/artifacts
      - name: Скриншоты приложения
        continue-on-error: true
        run: |
          # Иконку (.icon) собирает только свежий Xcode - для скриншота хватит приложения без неё.
          APP=build/Zametki.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp "$(swift build -c release --show-bin-path)/Zametki" $APP/Contents/MacOS/
          cp Resources/Info.plist $APP/Contents/
          cp Resources/Caveat.ttf $APP/Contents/Resources/
          codesign --force --sign - $APP
          python3 tools/ci-demo.py
          mkdir -p artifacts
          open build/Zametki.app --args -openNote demo-ci
          sleep 10
          screencapture -x artifacts/app.png
          pkill -x Zametki || true
          sleep 2
          open build/Zametki.app --args -openNote demo-ci -uiLayout craft -inspectorShown YES -demoType /
          sleep 10
          screencapture -x artifacts/app-menu.png
          pkill -x Zametki || true
          sleep 2
          open build/Zametki.app --args -openNote demo-ci -uiLayout quiet -demoType /
          sleep 10
          screencapture -x artifacts/app-slash.png
          pkill -x Zametki || true
          sleep 2
          open build/Zametki.app --args -openNote demo-ci -uiLayout notebook -focusMode YES -demoSelect 40,10
          sleep 10
          screencapture -x artifacts/app-focus.png
          pkill -x Zametki || true
      - name: Картинки экспорта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/
          if-no-files-found: ignore
